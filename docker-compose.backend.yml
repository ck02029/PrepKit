services:
  postgres:
    image: postgres:16
    container_name: prepkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prepkit}
      POSTGRES_USER: ${POSTGRES_USER:-prepkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - prepkit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-prepkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prepkit}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001}
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    command: ["npm", "run", "start:worker", "--workspace", "backend"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-prepkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prepkit}
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  prepkit_postgres_data:
