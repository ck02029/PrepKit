# Free-tier demo deployment. The API and durable worker share one web service
# because Render's free plan does not include private services or workers.
services:
  - type: web
    name: prepkit-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: npm run start:api-with-worker --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FRONTEND_ORIGIN
        value: https://prepkit-frontend-0ln5.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: prepkit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LLM_DAILY_CALLS_PER_KEY
        value: "150"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: MAX_QUESTIONS_PER_CATEGORY
        value: "6"
      - key: MAX_KITS_PER_DAY
        value: "10"
      - key: REGENERATIONS_PER_HOUR
        value: "6"
      - key: DB_POOL_MAX
        value: "5"

  - type: web
    name: prepkit-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: ""
      # Free web services cannot receive private-network requests, so the
      # Next.js API proxy uses the public HTTPS URL of the API web service.
      - key: BACKEND_INTERNAL_URL
        value: https://prepkit-api-lnhf.onrender.com

databases:
  - name: prepkit-db
    databaseName: prepkit
    user: prepkit
    region: singapore
    plan: free
    postgresMajorVersion: "16"
