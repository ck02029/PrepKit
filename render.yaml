services:
  - type: pserv
    name: prepkit-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FRONTEND_ORIGIN
        value: https://prepkit-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: prepkit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DB_POOL_MAX
        value: "10"

  - type: worker
    name: prepkit-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: npm run start:worker --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://prepkit-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: prepkit-db
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          name: prepkit-api
          type: pserv
          envVarKey: SESSION_SECRET
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DB_POOL_MAX
        value: "10"

  - type: web
    name: prepkit-frontend
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: ""
      - key: BACKEND_INTERNAL_URL
        fromService:
          name: prepkit-api
          type: pserv
          property: hostport

databases:
  - name: prepkit-db
    databaseName: prepkit
    user: prepkit
    region: singapore
    plan: 0.5c-1g
    diskSizeGB: 5
    postgresMajorVersion: "16"
